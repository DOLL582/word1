<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--ok:#15803d;--bad:#dc2626;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:84px}

.meaning{font-size:23px;line-height:1.55;margin:16px 0}.example{font-size:15px;line-height:1.6;color:#374151;background:#f8fafc;border-radius:12px;padding:12px;text-align:left}.note{font-size:13px;color:var(--warn);margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{padding:13px 12px;border-radius:12px;background:#eef2f7;color:var(--text);font-weight:650}.btn.primary{background:var(--accent);color:white}.btn.ok{background:#dcfce7;color:#166534}.btn.bad{background:#fee2e2;color:#991b1b}.btn.dark{background:#111827;color:white}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8fafc;border-radius:14px;padding:13px;text-align:center}.stat b{display:block;font-size:23px}.stat span{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:0}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:10}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{padding:10px 4px;background:transparent;color:var(--muted);font-size:12px}.nav button.active{color:var(--accent);font-weight:700}
.listrow{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.smallword{font-weight:700}.smallmeaning{font-size:13px;color:var(--muted);margin-top:3px}
.option{width:100%;text-align:left;margin:7px 0;padding:14px;border:1px solid var(--line);background:white;border-radius:12px}.option:hover{border-color:#93c5fd}
.hidden{display:none!important}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.pill{font-size:12px;background:#f3f4f6;border-radius:999px;padding:5px 9px;color:#4b5563}
.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;outline:none;background:white;margin-bottom:10px}
@media(max-width:500px){.word{font-size:34px}.meaning{font-size:20px}.card{padding:16px}}
</style>
</head>

oughly","phonetic":"/ˈrʌfli/","pos":"adv.","meaning":"大约；粗略地","note":""},{"id":216,"page":"1/10/16","word":"appreciation","phonetic":"/əˌpriːʃiˈeɪʃn/","pos":"n.","meaning":"欣赏；感激；增值","note":""},{"id":217,"page":"1/10/16","word":"furthermore","phonetic":"/ˌfɜːðəˈmɔː(r)/","pos":"adv.","meaning":"此外；而且","note":""},{"id":218,"page":"1/10/16","word":"interference","phonetic":"/ˌɪntəˈfɪərəns/","pos":"n.","meaning":"干涉；干扰","note":""},{"id":219,"page":"1/10/16","word":"cue","phonetic":"/kjuː/","pos":"n.","meaning":"提示；暗示","note":""},{"id":220,"page":"1/10/16","word":"bargain","phonetic":"/ˈbɑːɡən/","pos":"n./v.","meaning":"便宜货；讨价还价","note":""},{"id":221,"page":"1/10/16","word":"negotiate","phonetic":"/nɪˈɡəʊʃieɪt/","pos":"v.","meaning":"谈判；协商","note":""},{"id":222,"page":"1/10/16","word":"sentiment","phonetic":"/ˈsentɪmənt/","pos":"n.","meaning":"情绪；观点","note":""},{"id":223,"page":"1/10/16","word":"assign","phonetic":"/əˈsaɪn/","pos":"v.","meaning":"分配；指派","note":""},{"id":224,"page":"1/10/16","word":"trait","phonetic":"/treɪt/","pos":"n.","meaning":"特征；特质","note":""},{"id":225,"page":"1/10/16","word":"architecture","phonetic":"/ˈɑːkɪtektʃə(r)/","pos":"n.","meaning":"建筑；架构","note":""},{"id":226,"page":"1/10/16","word":"emission","phonetic":"/iˈmɪʃn/","pos":"n.","meaning":"排放；发射","note":""},{"id":227,"page":"1/10/16","word":"esteem","phonetic":"/ɪˈstiːm/","pos":"n./v.","meaning":"尊重；敬重","note":""},{"id":228,"page":"1/10/16","word":"snap","phonetic":"/snæp/","pos":"v./n.","meaning":"突然断裂；快照；厉声说","note":""},{"id":229,"page":"1/10/16","word":"notion","phonetic":"/ˈnəʊʃn/","pos":"n.","meaning":"概念；想法","note":""},{"id":230,"page":"1/10/16","word":"reminder","phonetic":"/rɪˈmaɪndə(r)/","pos":"n.","meaning":"提醒物；提示","note":""},{"id":231,"page":"1/10/16","word":"schedule","phonetic":"/ˈʃedjuːl/","pos":"n./v.","meaning":"日程；安排","note":"美式常读 /ˈskedʒuːl/"},{"id":232,"page":"1/10/16","word":"interpretation","phonetic":"/ɪnˌtɜːprɪˈteɪʃn/","pos":"n.","meaning":"解释；口译","note":""},{"id":233,"page":"1/10/16","word":"properly","phonetic":"/ˈprɒpəli/","pos":"adv.","meaning":"适当地；正确地","note":""},{"id":234,"page":"1/10/16","word":"enormous","phonetic":"/ɪˈnɔːməs/","pos":"adj.","meaning":"巨大的","note":""},{"id":235,"page":"1/10/16","word":"obscure","phonetic":"/əbˈskjʊə(r)/","pos":"adj./v.","meaning":"晦涩的；掩盖","note":""},{"id":236,"page":"1/10/16","word":"apparently","phonetic":"/əˈpærəntli/","pos":"adv.","meaning":"显然；据说","note":""},{"id":237,"page":"1/10/16","word":"cautious","phonetic":"/ˈkɔːʃəs/","pos":"adj.","meaning":"谨慎的","note":""},{"id":238,"page":"1/10/16","word":"sum","phonetic":"/sʌm/","pos":"n./v.","meaning":"金额；总和；总结","note":""},{"id":239,"page":"1/10/16","word":"subtle","phonetic":"/ˈsʌtl/","pos":"adj.","meaning":"微妙的；难以察觉的","note":""},{"id":240,"page":"1/10/16","word":"standardise","phonetic":"/ˈstændədaɪz/","pos":"v.","meaning":"使标准化","note":"英式；美式 standardize"},{"id":241,"page":"1/10/16","word":"sample","phonetic":"/ˈsɑːmpl/","pos":"n./v.","meaning":"样本；抽样","note":""},{"id":242,"page":"1/10/16","word":"attend","phonetic":"/əˈtend/","pos":"v.","meaning":"参加；照料；注意","note":""},{"id":243,"page":"1/10/16","word":"rigid","phonetic":"/ˈrɪdʒɪd/","pos":"adj.","meaning":"僵硬的；严格的","note":""},{"id":244,"page":"1/10/16","word":"reviewer","phonetic":"/rɪˈvjuːə(r)/","pos":"n.","meaning":"审稿人；评论者","note":""},{"id":245,"page":"1/10/16","word":"convention","phonetic":"/kənˈvenʃn/","pos":"n.","meaning":"惯例；大会；公约","note":""},{"id":246,"page":"1/10/16","word":"contain","phonetic":"/kənˈteɪn/","pos":"v.","meaning":"包含；控制","note":""},{"id":247,"page":"1/10/16","word":"initiative","phonetic":"/ɪˈnɪʃətɪv/","pos":"n.","meaning":"倡议；主动性","note":""},{"id":248,"page":"1/10/16","word":"integrity","phonetic":"/ɪnˈteɡrəti/","pos":"n.","meaning":"正直；完整","note":""},{"id":249,"page":"1/10/16","word":"hormone","phonetic":"/ˈhɔːməʊn/","pos":"n.","meaning":"激素","note":""},{"id":250,"page":"1/10/16","word":"inherent","phonetic":"/ɪnˈhɪərənt/","pos":"adj.","meaning":"固有的；内在的","note":""},{"id":251,"page":"1/10/16","word":"household","phonetic":"/ˈhaʊshəʊld/","pos":"n./adj.","meaning":"家庭；家喻户晓的","note":""},{"id":252,"page":"1/10/16","word":"ambiguous","phonetic":"/æmˈbɪɡjuəs/","pos":"adj.","meaning":"模棱两可的","note":""},{"id":253,"page":"1/10/16","word":"credibility","phonetic":"/ˌkredəˈbɪləti/","pos":"n.","meaning":"可信度","note":""},{"id":254,"page":"1/10/16","word":"modest","phonetic":"/ˈmɒdɪst/","pos":"adj.","meaning":"适度的；谦虚的","note":""},{"id":255,"page":"1/10/16","word":"compensation","phonetic":"/ˌkɒmpenˈseɪʃn/","pos":"n.","meaning":"补偿；赔偿","note":""},{"id":256,"page":"1/10/16","word":"rail","phonetic":"/reɪl/","pos":"n.","meaning":"铁路；栏杆","note":""},{"id":257,"page":"1/10/16","word":"pledge","phonetic":"/pledʒ/","pos":"n./v.","meaning":"承诺；保证","note":""}];
const KEY='word-memory-v1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{records:{},settings:{dailyNew:20},session:null};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function rec(id){return state.records[id]||(state.records[id]={seen:0,correct:0,wrong:0,box:0,next:0,last:0})}
function dueWords(){let now=Date.now();return WORDS.filter(w=>{let r=rec(w.id);return r.seen===0||r.next<=now})}
function pct(a,b){return b?Math.round(a/b*100):0}
function speak(text){if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}}
function speakCurrent(){if(state.session)speak(state.session.word.word)}
function setNav(id){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));let b=document.getElementById('n-'+id);if(b)b.classList.add('active')}
function show(view){
 if(view==='home')home(); if(view==='words')words(); if(view==='stats')stats(); setNav(view==='words'?'words':view==='stats'?'stats':'home')
}
function home(){
 let due=dueWords().length, learned=WORDS.filter(w=>rec(w.id).seen>0).length;
 let correct=WORDS.reduce((a,w)=>a+rec(w.id).correct,0), wrong=WORDS.reduce((a,w)=>a+rec(w.id).wrong,0);
 document.getElementById('main').innerHTML=`<div class="card hero">
 <div class="sub">今日待复习</div><div style="font-size:48px;font-weight:800;margin:4px">${due}</div>
 <div class="grid"><button class="btn primary" onclick="startStudy()">开始学习</button><button class="btn" onclick="startQuiz()">综合测试</button></div>
 </div>
 <div class="card"><div class="stats">
 <div class="stat"><b>${WORDS.length}</b><span>词库总数</span></div>
 <div class="stat"><b>${learned}</b><span>已学习</span></div>
 <div class="stat"><b>${pct(correct,correct+wrong)}%</b><span>总体正确率</span></div>
 </div></div>
 <div class="card"><div class="topline"><b>学习说明</b><span class="pill">离线可用</span></div>
 <div style="line-height:1.7;color:#4b5563;font-size:14px">先回忆单词，再查看释义。每次回答都会影响下一次出现时间；答错的词会更快进入复习队列。</div></div>`;
}
function startStudy(){
 let due=dueWords(); if(!due.length){alert('当前没有到期复习的单词。可以进入“综合测试”继续练习。');return}
 state.session={mode:'study',queue:shuffle(due),i:0,word:null,revealed:false};nextStudy();setNav('study')
}
function nextStudy(){
 let s=state.session;if(!s||s.i>=s.queue.length){finishSession();return}
 s.word=s.queue[s.i];s.revealed=false;renderStudy()
}
function renderStudy(){
 let s=state.session,w=s.word,r=rec(w.id),total=s.queue.length;
 document.getElementById('main').innerHTML=`<div class="card">
 <div class="topline"><span class="pill">${s.i+1} / ${total}</span><span class="pill">已答 ${r.correct+r.wrong} 次</span></div>
 <div class="progress"><i style="width:${(s.i/total)*100}%"></i></div>
 <div class="hero" style="box-shadow:none;padding-left:0;padding-right:0">
 <div class="word">${esc(w.word)}</div><div class="phonetic">${esc(w.phonetic)}</div>
 <button class="btn" style="margin-top:10px" onclick="speak('${jsq(w.word)}')">🔊 发音</button>
 ${s.revealed?`<div class="pos">${esc(w.pos)}</div><div class="meaning">${esc(w.meaning)}</div>
 ${w.note?`<div class="note">备注：${esc(w.note)}</div>`:''}
 <div class="grid" style="margin-top:20px"><button class="btn bad" onclick="answer(false)">❌ 不认识</button><button class="btn ok" onclick="answer(true)">✓ 认识</button></div>`
 :`<div style="color:#6b7280;margin:26px 0 18px">先在脑中回忆含义</div><button class="btn dark" style="width:100%" onclick="reveal()">显示释义</button>`}
 </div></div>`;
}
function reveal(){state.session.revealed=true;renderStudy()}
function answer(ok){
 let w=state.session.word,r=rec(w.id),now=Date.now();r.seen++;r.last=now;ok?r.correct++:r.wrong++;
 // 简单、稳健的本地 SRS：错误 10 分钟；首次正确 1 天；连续正确逐步延长
 if(!ok){r.box=0;r.next=now+10*60*1000}
 else{r.box=Math.min(r.box+1,6);let days=[1,2,4,7,15,30][r.box-1]||30;r.next=now+days*86400000}
 save();state.session.i++;nextStudy()
}
function finishSession(){state.session=null;save();home();alert('本轮学习完成。系统已根据你的回答安排下一次复习。')}
function startQuiz(){
 let q=shuffle(WORDS).slice(0,Math.min(10,WORDS.length));state.session={mode:'quiz',queue:q,i:0,score:0,word:q[0]};renderQuiz();setNav('study')
}
function renderQuiz(){
 let s=state.session,w=s.queue[s.i],opts=shuffle([w,...shuffle(WORDS.filter(x=>x.id!==w.id)).slice(0,3)]);
 document.getElementById('main').innerHTML=`<div class="card"><div class="topline"><span class="pill">测试 ${s.i+1}/${s.queue.length}</span><span class="pill">得分 ${s.score}</span></div>
 <div class="hero"><div class="word">${esc(w.word)}</div><div class="phonetic">${esc(w.phonetic)}</div><button class="btn" onclick="speak('${jsq(w.word)}')">🔊</button></div>
 <div><b>请选择最符合的释义：</b>${opts.map(o=>`<button class="option" onclick="quizAnswer(${o.id},${w.id})">${esc(o.meaning)}</button>`).join('')}</div></div>`;
}
function quizAnswer(id,correctId){let s=state.session;if(id===correctId)s.score++;let w=WORDS.find(x=>x.id===correctId),r=rec(correctId);r.seen++;if(id===correctId){r.correct++;r.box=Math.min(r.box+1,6);r.next=Date.now()+([1,2,4,7,15,30][r.box-1]||30)*86400000}else{r.wrong++;r.box=0;r.next=Date.now()+10*60*1000}save();s.i++;if(s.i>=s.queue.length){let score=s.score;state.session=null;home();setTimeout(()=>alert(`测试结束：${score}/${s.queue.length}`),50)}else renderQuiz()}
function words(){
 document.getElementById('main').innerHTML=`<div class="card"><input class="search" id="search" placeholder="搜索单词或释义…" oninput="filterWords()"><div id="wordlist"></div></div>`;
 filterWords();setNav('words')
}
function filterWords(){let q=(document.getElementById('search')?.value||'').toLowerCase();let arr=WORDS.filter(w=>(w.word+' '+w.meaning).toLowerCase().includes(q));document.getElementById('wordlist').innerHTML=arr.map(w=>`<div class="listrow"><div><div class="smallword">${esc(w.word)} <span class="sub">${esc(w.phonetic)}</span></div><div class="smallmeaning">${esc(w.meaning)}</div></div><button class="btn" onclick="speak('${jsq(w.word)}')">🔊</button></div>`).join('')}
function stats(){
 let learned=WORDS.filter(w=>rec(w.id).seen>0), totalA=learned.reduce((a,w)=>a+rec(w.id).correct,0),totalB=learned.reduce((a,w)=>a+rec(w.id).wrong,0);
 let weak=learned.slice().sort((a,b)=>{let ra=rec(a.id),rb=rec(b.id);return pct(ra.correct,ra.correct+ra.wrong)-pct(rb.correct,rb.correct+rb.wrong)}).slice(0,10);
 document.getElementById('main').innerHTML=`<div class="card"><div class="stats"><div class="stat"><b>${learned.length}</b><span>已学习</span></div><div class="stat"><b>${WORDS.length-learned.length}</b><span>未学习</span></div><div class="stat"><b>${pct(totalA,totalA+totalB)}%</b><span>正确率</span></div></div></div>
 <div class="card"><div class="topline"><b>薄弱词</b><span class="pill">按正确率</span></div>${weak.length?weak.map(w=>{let r=rec(w.id);return `<div class="listrow"><div><div class="smallword">${esc(w.word)}</div><div class="smallmeaning">${esc(w.meaning)}</div></div><span class="pill">${pct(r.correct,r.correct+r.wrong)}%</span></div>`}).join(''):'暂无数据，完成几轮学习后这里会出现。'}</div>`;
 setNav('stats')
}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function jsq(x){return String(x).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
home();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body></html>
